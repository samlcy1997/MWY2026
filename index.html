function switchDay(d){currentDay=d;renderDay();setTop(`第${d}日 · ${DAYS[d].title}`,true);resetMainScroll();history.replaceState({v:'day',d,mode},'',`#day-${d}-${mode}`)}
function setMode(m){mode=m;renderDay();resetMainScroll();history.replaceState({v:'day',d:currentDay,mode},'',`#day-${currentDay}-${mode}`)}
function renderDay(){const day=DAYS[currentDay];$('#dayTitle').textContent=`第${currentDay}日`;$('#daySub').textContent=day.title;$('#dayDate').textContent=day.date;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active',+b.dataset.d===currentDay));$('#tBtn').classList.toggle('active',mode==='timeline');$('#mBtn').classList.toggle('active',mode==='map');$('#timelinePane').classList.toggle('hidden',mode!=='timeline');$('#mapPane').classList.toggle('hidden',mode!=='map');if(mode==='timeline')renderTimeline();else{renderMap();setTimeout(initMap,30)}}
function renderTimeline(){const items=DAYS[currentDay].items;$('#timelinePane').innerHTML=`<div class="timeline">${items.map((x,i)=>`${i?`<div class="route-link">${items[i-1].move||''}</div>`:''}<div class="stop"><div class="stop-time">${x.time}</div><div class="stop-track"><div class="stop-dot ${x.anchor?'anchor':''}"></div></div><button class="stop-card" onclick="openDetail('${x.id}')"><span class="stop-kind">${x.kind}</span><h3>${x.title}</h3><p>${x.sub}</p></button></div>`).join('')}</div>`}

function renderMap(){const mapped=DAYS[currentDay].items.filter(x=>x.coord);const x=mapped[selected[currentDay]]||mapped[0];$('#mapPane').innerHTML=`<div id="realMap"><div class="mapfallback">載入互動地圖…<br><small>地圖只用嚟理解站點位置；實際導航交畀高德。</small></div></div><div class="map-tools"><button onclick="fitDay()">顯示全日</button><button onclick="selectMapStop(0,true)">第一站</button><button onclick="selectMapStop(${Math.max(0,mapped.length-1)},true)">最後一站</button></div><div id="mapInspector">${inspectorHTML(x,mapped)}</div><div class="map-note">地圖唔負責即時路況／轉乘。地址同現場時間規則先係行程書主資料。</div>`}
function inspectorHTML(x,mapped){if(!x)return'';const i=mapped.indexOf(x);return `<div class="map-inspector"><small>站點 ${i+1}/${mapped.length}</small><h3>${x.time} · ${x.title}</h3><p>${x.sub}${x.address?`<br>${x.address}`:''}</p><div class="map-actions"><button class="primary" onclick="openDetail('${x.id}')">打開詳細頁</button><button class="secondary" onclick="goTimeline()">回時間線</button></div></div>`}
function outOfChina(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271}
function transformLat(x,y){let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
function transformLng(x,y){let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
function gcjToWgs(lng,lat){if(outOfChina(lng,lat))return[lng,lat];const a=6378245,ee=.00669342162296594323,dLat=transformLat(lng-105,lat-35),dLng=transformLng(lng-105,lat-35),rad=lat/180*Math.PI,s=Math.sin(rad),m=1-ee*s*s,sm=Math.sqrt(m),mgLat=lat+(dLat*180)/((a*(1-ee))/(m*sm)*Math.PI),mgLng=lng+(dLng*180)/(a/sm*Math.cos(rad)*Math.PI);return[lng*2-mgLng,lat*2-mgLat]}
function initMap(){const mapped=DAYS[currentDay].items.filter(x=>x.coord),box=document.getElementById('realMap');if(typeof maplibregl==='undefined'){if(box)box.innerHTML='<div class="mapfallback">地圖元件載入失敗。可直接複製地址去高德。</div>';return}try{if(mapObj)mapObj.remove();mapMarkers=[];const coords=mapped.map(x=>gcjToWgs(...x.coord));box.innerHTML='';mapObj=new maplibregl.Map({container:box,style:OSM_RASTER_STYLE,center:coords[selected[currentDay]]||coords[0],zoom:12,attributionControl:true});mapObj.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');let ready=false;const failTimer=setTimeout(()=>{if(!ready&&box)box.innerHTML='<div class="mapfallback">底圖載入逾時；站點資料仍可用，導航請交畀高德。</div>'},8000);mapObj.on('load',()=>{ready=true;clearTimeout(failTimer);mapMarkers=mapped.map((x,i)=>{const el=document.createElement('div');el.className='trip-marker'+(x.anchor?' anchor':'')+(selected[currentDay]===i?' selected':'');el.textContent=i+1;el.onclick=()=>selectMapStop(i,true);return new maplibregl.Marker({element:el}).setLngLat(coords[i]).addTo(mapObj)});if(coords.length>1){mapObj.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:coords}}});mapObj.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#169f99','line-width':3,'line-opacity':.65,'line-dasharray':[1.2,1.5]}})}fitDay()})}catch(e){if(box)box.innerHTML='<div class="mapfallback">地圖喺目前環境載入唔到；詳細頁同地址複製功能仍可正常用。</div>'}}
function fitDay(){if(!mapObj)return;const cs=DAYS[currentDay].items.filter(x=>x.coord).map(x=>gcjToWgs(...x.coord));if(!cs.length)return;if(cs.length===1){mapObj.flyTo({center:cs[0],zoom:14});return}const b=cs.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(cs[0],cs[0]));mapObj.fitBounds(b,{padding:55,maxZoom:14,duration:350})}
function selectMapStop(i,fly){const mapped=DAYS[currentDay].items.filter(x=>x.coord);selected[currentDay]=i;const x=mapped[i];if($('#mapInspector'))$('#mapInspector').innerHTML=inspectorHTML(x,mapped);mapMarkers.forEach((m,j)=>m.getElement().classList.toggle('selected',j===i));if(fly&&mapObj&&x)mapObj.flyTo({center:gcjToWgs(...x.coord),zoom:14.5,duration:450})}
function goTimeline(){setMode('timeline')}

function guideHTML(){return `<div class="guide-intro"><h2>指南</h2><p>網站只保存現場會用到嘅結論。Day 1 已按最新「已鎖行程」重建；後面舊 research 只當 provenance，唔反過來覆蓋主線。</p><div class="privacy-note"><b>公開版只保留必要識別資料。</b> 住宿名稱保留作導航識別；航班編號、住宿地址／聯絡資料唔存在 HTML 原始碼。右上「公開」只係狀態標記。</div></div><div class="guide-group"><h3>資料狀態</h3><div class="status-list"><div class="status-row"><div class="state">Day 1</div><div><b>10/31 主線已重鎖</b><p>南京東路 → 外白渡橋／外灘 → 浦東反拍 → 金橋 Freedom Gundam；上海之巔移出主線。</p></div></div><div class="status-row"><div class="state">攝影</div><div><b>外灘／武康／張園 reference 已整理</b><p>免費圖直接展示；攝影師作品只連原作者頁。</p></div></div><div class="status-row warn"><div class="state">待公告</div><div><b>MWY 相機／袋／安檢／再次入場</b><p>只保留決策分支，唔自行補答案。</p></div></div></div></div><div class="guide-group"><h3>臨行刷新</h3><div class="mini-route"><div class="r"><strong>T-7至3日</strong><span>餐廳營業／臨休／搬遷；上海天氣同能見度。上海之巔只作bonus，不再因天氣牽動主線。</span></div><div class="r"><strong>T-2至1日</strong><span>外灘／小陸家嘴10/31景觀照明；東金線渡輪班次／臨時停航；Freedom Gundam 夜間演出場次。</span></div><div class="r"><strong>T-1日</strong><span>萊萊、泰康、東泰祥、張師傅、琪琪、小楊、王記、海金滋、味香齋快速睇「今日營業」。</span></div><div class="r"><strong>當日</strong><span>只看排隊長度、下一個固定時間點、實際天氣／人流；Day 1約15:45之後唔再畀食物侵蝕外灘光線。</span></div></div></div><div class="guide-group"><h3>Day 1 固定節點</h3><div class="status-list"><div class="status-row"><div class="state">19:45</div><div><b>1:1 Freedom Gundam</b><p>夜攝＋等一輪夜間演出；精確場次臨行再核。</p></div></div><div class="status-row"><div class="state">20:40</div><div><b>THE GUNDAM BASE SHANGHAI</b><p>金橋LaLaport 4F；官方現時10:00–22:00。</p></div></div><div class="status-row"><div class="state">Bonus</div><div><b>上海之巔唔屬主線</b><p>只有能見度極佳＋時間異常充裕先再考慮；唔犧牲外灘／Freedom。</p></div></div></div></div><div class="guide-group"><h3>固定導航資料</h3><div class="status-list"><div class="status-row"><div class="state">住宿</div><div><b>如家商旅酒店（上海火車站南廣場店）</b><p>地址／聯絡資料不存於公開版；Day 2相機禁帶時，前台貴重物品寄存係優先研究方案。</p></div></div><div class="status-row"><div class="state">返程</div><div><b>11/2 · 航班資料已隱藏 · 19:05 PVG T2</b><p>15:30–15:40由住宿出發較舒服；15:50只作最遲正常值。</p></div></div></div></div>`}

function initDetailPhotoMap(id){if(detailMapObj){try{detailMapObj.remove()}catch(e){}detailMapObj=null}const cfg=PHOTO_MAPS[id],el=document.getElementById(`photoMap-${id}`);if(!cfg||!el)return;if(typeof maplibregl==='undefined'){el.innerHTML='<div class="photo-map-fallback">地圖元件載入唔到；下面嘅站位／焦段仍然可用。</div>';return}try{const pts=cfg.points.map(p=>p.wgs);el.innerHTML='';detailMapObj=new maplibregl.Map({container:el,style:OSM_RASTER_STYLE,center:pts[0],zoom:cfg.zoom||15,interactive:false,attributionControl:true});let ready=false;const failTimer=setTimeout(()=>{if(!ready)el.innerHTML='<div class="photo-map-fallback">機位底圖載入逾時；用下面站位名稱去高德認位即可。</div>'},8000);detailMapObj.on('load',()=>{ready=true;clearTimeout(failTimer);cfg.points.forEach(p=>{const m=document.createElement('div');m.className='photo-pin'+(p.hot?' hot':'');m.textContent=p.label;m.title=p.name;new maplibregl.Marker({element:m}).setLngLat(p.wgs).addTo(detailMapObj)});if(pts.length>1){detailMapObj.addSource('photo-route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:pts}}});detailMapObj.addLayer({id:'photo-route-line',type:'line',source:'photo-route',paint:{'line-color':'#0f9f97','line-width':3,'line-opacity':.8,'line-dasharray':[1.1,1.2]}});const b=pts.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(pts[0],pts[0]));detailMapObj.fitBounds(b,{padding:42,maxZoom:cfg.zoom||15,duration:0})}})}catch(e){el.innerHTML='<div class="photo-map-fallback">機位圖喺目前環境載入唔到；用下面站位名稱去高德認位即可。</div>'}}
function openDetail(id,push=true){const fn=P[id]||(()=>`${pageHead('詳細頁',id,'暫未有內容。')}`);$('#article').innerHTML=fn();$('#detailTitle').textContent=PAGE_META[id]?.title||id;$('#detail').classList.add('open');detailOpen=true;$('#detail').scrollTop=0;setTimeout(()=>initDetailPhotoMap(id),35);if(push)history.pushState({v:'detail',id},'',`#detail-${id}`)}
function closeDetail(){if(!detailOpen)return;$('#detail').classList.remove('open');detailOpen=false;if(history.state?.v==='detail')history.back()}
function copyText(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t);const old=$('#pageTitle').textContent;$('#pageTitle').textContent='已複製';setTimeout(()=>$('#pageTitle').textContent=old,650)}
function restoreFromHash(){const h=location.hash;if(h.startsWith('#detail-')){const id=h.replace('#detail-','');openDay(findDayForId(id),false);openDetail(id,false);history.replaceState({v:'detail',id},'',h);return}if(h.startsWith('#day-')){const m=h.match(/^#day-(\d)(?:-(map|timeline))?$/);if(m){currentDay=+m[1];mode=m[2]||'timeline';hideMain();$('#dayView').classList.remove('hidden');setTop(`第${currentDay}日 · ${DAYS[currentDay].title}`,true);nav('day');renderDay();history.replaceState({v:'day',d:currentDay,mode},'',h);return}}if(h==='#guide'){showGuide(false);history.replaceState({v:'guide'},'',h);return}showTrip(false)}
function findDayForId(id){for(const [d,x] of Object.entries(DAYS))if(x.items.some(i=>i.id===id))return +d;return 1}
window.addEventListener('popstate',e=>{if(detailOpen&&e.state?.v!=='detail'){$('#detail').classList.remove('open');detailOpen=false}const s=e.state;if(!s||s.v==='trip'){showTrip(false);return}if(s.v==='day'){currentDay=s.d;mode=s.mode||'timeline';hideMain();$('#dayView').classList.remove('hidden');setTop(`第${currentDay}日 · ${DAYS[currentDay].title}`,true);nav('day');renderDay();return}if(s.v==='guide'){showGuide(false);return}if(s.v==='detail'){const d=findDayForId(s.id);openDay(d,false);openDetail(s.id,false)}});
init();
</script>
