<style>
:root{
  --bg:#f6f8f8;--paper:#fff;--ink:#0e1516;--sub:#687476;--line:#dce4e4;
  --accent:#18c9c1;--accent-ink:#08756f;--soft:#e8f9f7;--warn:#946300;--warnbg:#fff3d8;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
body{min-height:100dvh}
button{font:inherit;color:inherit}
button:active{transform:scale(.985)}
img{max-width:100%;display:block}
.shell{max-width:820px;margin:0 auto;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(246,248,248,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:15px;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;font-size:22px;cursor:pointer}
.main{padding:16px 16px 105px}
.hidden{display:none!important}
.cover{min-height:280px;background:#101718;color:#fff;border-radius:28px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.cover small{font-size:10px;letter-spacing:.14em;color:#9baaaa;font-weight:850}
.cover h2{font-size:38px;line-height:1.01;letter-spacing:-.055em;margin:8px 0 0;max-width:11ch}
.cover p{font-size:13px;line-height:1.6;color:#ced6d6;max-width:46ch}
.cover-meta{display:flex;gap:7px;flex-wrap:wrap}.meta{font-size:9px;border:1px solid rgba(255,255,255,.16);padding:7px 9px;border-radius:999px}
.section{margin-top:24px}.kicker{font-size:9px;letter-spacing:.14em;font-weight:900;color:#788485;margin:0 0 9px}
.next{display:grid;grid-template-columns:65px 1fr auto;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.next .nt{font-size:21px;font-weight:900;letter-spacing:-.04em}.next h3,.row h3{margin:0;font-size:16px;letter-spacing:-.025em}.next p,.row p{font-size:11px;line-height:1.45;color:var(--sub);margin:4px 0 0}
.cta{border:0;border-radius:11px;padding:9px 11px;background:var(--soft);color:var(--accent-ink);font-size:10px;font-weight:900;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.daypick{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;cursor:pointer}.daypick b{font-size:13px}.daypick span{display:block;font-size:9px;color:var(--sub);line-height:1.4;margin-top:4px}
.dayhead{display:flex;justify-content:space-between;align-items:end;margin:2px 0 14px}.dayhead h2{font-size:30px;letter-spacing:-.045em;margin:0}.dayhead p{font-size:11px;color:var(--sub);margin:5px 0 0}
.seg,.viewseg{display:grid;background:#e8eeee;padding:3px;border-radius:13px}.seg{grid-template-columns:repeat(3,1fr);margin-bottom:10px}.viewseg{grid-template-columns:1fr 1fr;margin-bottom:16px}
.seg button,.viewseg button{border:0;background:transparent;border-radius:10px;padding:9px;font-size:11px;font-weight:850;color:#6b7677;cursor:pointer}.seg button.active,.viewseg button.active{background:#fff;color:#111;box-shadow:0 2px 7px rgba(0,0,0,.06)}
.timeline{position:relative}.timeline:before{content:"";position:absolute;left:28px;top:18px;bottom:18px;width:1px;background:#ccd6d6}
.stop{position:relative;padding-left:57px;margin-bottom:10px}.dot{position:absolute;left:22px;top:17px;width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.row{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.15s}.row.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(24,201,193,.12)}.rowtop{display:flex;justify-content:space-between;gap:12px}.time{font-size:10px;color:var(--accent-ink);font-weight:900;margin-bottom:4px}.kind{font-size:9px;color:#788283}
.row-actions{display:flex;gap:6px;align-items:center}.locate{border:1px solid var(--line);background:#f8fafa;border-radius:10px;padding:7px 8px;font-size:9px;font-weight:850;cursor:pointer}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:8px;padding:5px 7px;background:#f0f3f3;color:#687274;border-radius:999px}
.linker{margin:-2px 0 9px 57px;color:#818b8c;font-size:9px}.linker:before{content:"↓";margin-right:7px}
.bottomnav{position:fixed;left:50%;bottom:0;z-index:50;transform:translateX(-50%);width:min(820px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.95);backdrop-filter:blur(18px)}
.nav{border:0;background:transparent;border-radius:11px;padding:10px 8px;font-size:10px;font-weight:850;color:#6e797a;cursor:pointer}.nav.active{background:var(--soft);color:var(--accent-ink)}
#realMap{height:470px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#e9eeee}
.mapfallback{height:100%;display:grid;place-items:center;text-align:center;color:#687475;padding:30px}
.trip-marker{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--accent);font-size:10px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.16);cursor:pointer}.trip-marker.event{background:#111;color:#fff;border-color:#111}.trip-marker.selected{width:36px;height:36px;background:var(--accent);color:#073f3b;border-color:#fff;box-shadow:0 0 0 3px var(--accent),0 9px 24px rgba(0,0,0,.2)}
.map-tools{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.map-tools button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font-size:9px;font-weight:850;cursor:pointer}
.map-inspector{background:#101718;color:#fff;border-radius:18px;padding:15px;margin:12px 0}.map-inspector small{font-size:8px;letter-spacing:.11em;color:#91a0a0;font-weight:900}.map-inspector h3{font-size:17px;margin:5px 0 4px}.map-inspector p{font-size:10px;color:#c6cece;line-height:1.5;margin:0 0 11px}.map-inspector .mi-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.map-inspector button{border:0;border-radius:11px;padding:10px;font-size:9px;font-weight:900;cursor:pointer}.map-inspector .primary{background:var(--accent);color:#063d39}.map-inspector .secondary{background:#293233;color:#fff}
.recheckline{margin-top:16px;padding-top:11px;border-top:1px solid var(--line);font-size:10px;color:#778283;line-height:1.5}
.detail{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}.detail.open{transform:translateX(0)}
.dtop{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 9px) 13px 9px;background:rgba(246,248,248,.95);backdrop-filter:blur(17px);border-bottom:1px solid var(--line)}.dtop strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.article{max-width:820px;margin:0 auto;padding:18px 16px 58px}.article h1{font-size:36px;line-height:1.02;letter-spacing:-.055em;margin:8px 0 9px}.article .deck{font-size:13px;color:var(--sub);line-height:1.65;max-width:52ch;margin:0 0 18px}
.status{display:inline-flex;font-size:8px;font-weight:900;padding:6px 8px;border-radius:999px;background:#e9f8f6;color:#19756f}.status.warn{background:var(--warnbg);color:var(--warn)}.status.danger{background:var(--dangerbg);color:var(--danger)}
.heroimg{border-radius:22px;overflow:hidden;background:#dfe5e5;min-height:230px}.heroimg img{width:100%;height:100%;min-height:230px;max-height:440px;object-fit:cover}.caption{font-size:8px;color:#7a8586;line-height:1.5;margin-top:6px}
.article h2{font-size:21px;letter-spacing:-.035em;margin:23px 0 10px}.article h3{font-size:13px;margin:14px 0 7px}.article p{font-size:11px;color:#3f494a;line-height:1.65}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice>div,.fact{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.choice b{font-size:17px}.choice span,.fact span{display:block;color:var(--sub);font-size:9px;line-height:1.45;margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fact b{font-size:11px}
.callout{border-left:3px solid var(--accent);padding:8px 0 8px 13px;margin:17px 0}.callout strong{font-size:12px;display:block}.callout p{margin:4px 0 0;color:#596465}
.warnbox{background:var(--warnbg);border:1px solid #efd99c;border-radius:16px;padding:13px;margin:14px 0}.warnbox b{font-size:11px}.warnbox p{font-size:10px;color:#6f5a27;margin:5px 0 0}
.matrix{width:100%;border-collapse:collapse;margin:10px 0}.matrix th,.matrix td{font-size:9px;text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);vertical-align:top}.matrix th{color:#6b7677}.matrix td strong{font-size:10px}
.route{margin:12px 0}.route-step{display:grid;grid-template-columns:54px 1fr;gap:10px;position:relative;padding-bottom:18px}.route-step:not(:last-child):after{content:"";position:absolute;left:24px;top:25px;bottom:0;width:1px;background:#c9d3d3}.route-dot{position:absolute;left:19px;top:21px;width:11px;height:11px;border-radius:50%;background:var(--accent);transform:translateX(-54px)}.route-time{font-size:9px;color:var(--accent-ink);font-weight:900}.route-copy b{font-size:12px}.route-copy span{display:block;font-size:9px;color:var(--sub);line-height:1.45;margin-top:4px}
.lightbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.lightbar div{background:#e9eeee;border-radius:11px;padding:11px 6px;text-align:center;font-size:8px;line-height:1.45}.lightbar .hot{background:#dff8f6;color:#076e68;font-weight:900}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.compare>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.compare h3{margin:0 0 8px}.compare p{font-size:9px;margin:4px 0}
.eventgrid{display:grid;gap:8px}.eventmod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.eventmod .head{display:flex;justify-content:space-between;gap:10px}.eventmod h3{margin:0;font-size:12px}.eventmod .state{font-size:8px;font-weight:900;color:var(--accent-ink)}.eventmod.tba .state{color:#966800}.eventmod p{font-size:9px;color:var(--sub);margin:6px 0 0}
.hallplan{display:grid;grid-template-columns:1.25fr .75fr;gap:9px;margin-top:12px}.hall{border-radius:16px;padding:16px;background:#fff;border:1px solid var(--line)}.hall.primary{border-color:var(--accent);background:#effcfb}.hall b{display:block;font-size:13px}.hall span{display:block;font-size:9px;color:var(--sub);line-height:1.45;margin-top:5px}
.next-hop{background:#101718;color:#fff;border-radius:18px;padding:14px;margin-top:20px}.next-hop small{font-size:8px;color:#91a0a0;font-weight:900;letter-spacing:.1em}.next-hop b{display:block;font-size:13px;margin:5px 0 10px}.next-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.next-actions button{border:0;border-radius:11px;padding:10px;font-size:9px;font-weight:900}.next-actions .a{background:var(--accent);color:#063d39}.next-actions .b{background:#293233;color:#fff}
.actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));margin:24px -16px -58px;background:rgba(246,248,248,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.actions button{border:0;border-radius:12px;padding:11px;font-size:9px;font-weight:900}.actions .primary{background:var(--accent);color:#063d39}.actions .secondary{background:#fff;border:1px solid var(--line)}
.guideitem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}.guideitem h3{margin:0;font-size:13px}.guideitem p{font-size:10px;color:var(--sub);margin:5px 0 0;line-height:1.45}
.state-list{display:grid;gap:8px}.state-row{display:grid;grid-template-columns:82px 1fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.state-row span{font-size:8px;font-weight:900}.state-row b{font-size:10px}.state-row p{font-size:9px;color:var(--sub);margin:3px 0 0;line-height:1.4}
.viewer{margin:12px 0}.viewstage{height:360px;border-radius:22px;overflow:hidden;background:#dfe4e4;position:relative}.viewstage img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease,opacity .18s ease}.viewlabel{position:absolute;left:12px;top:12px;background:rgba(14,21,22,.84);color:#fff;border-radius:10px;padding:7px 9px;font-size:9px;font-weight:900}.viewmeta{font-size:9px;color:var(--sub);line-height:1.45;margin:8px 2px 0}
.viewtabs,.lenstabs,.venue-tabs{display:flex;gap:7px;overflow:auto;padding:9px 0 2px;scrollbar-width:none}.viewtabs button,.lenstabs button,.venue-tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:9px;font-weight:850;cursor:pointer}.viewtabs button.active,.lenstabs button.active,.venue-tabs button.active{background:#101718;color:#fff;border-color:#101718}
.pano{margin-top:13px}.panoview{height:245px;border-radius:18px;overflow:hidden;background:#dfe4e4;position:relative;touch-action:none;cursor:grab}.panoview:active{cursor:grabbing}.panoview img{height:100%;width:auto;max-width:none;position:absolute;left:0;top:0;user-select:none;pointer-events:none}.panotag{position:absolute;left:10px;bottom:10px;background:rgba(14,21,22,.82);color:#fff;border-radius:9px;padding:6px 8px;font-size:8px}
.venue-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.venue-card img{width:100%;height:235px;object-fit:cover}.venue-copy{padding:13px}.venue-copy h3{margin:0 0 6px;font-size:14px}.venue-copy p{font-size:9px;color:var(--sub);margin:0;line-height:1.5}
.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.photo-pair .heroimg{min-height:180px}.photo-pair .heroimg img{min-height:180px;height:230px}

.restaurant-arrival{margin:14px 0 22px}
.restaurant-arrival .arrival-photo{border-radius:22px;overflow:hidden;background:#dfe5e5;position:relative}
.restaurant-arrival .arrival-photo img{width:100%;height:310px;object-fit:cover}
.restaurant-arrival .arrival-info{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:12px 2px 0}
.restaurant-arrival .arrival-info small{display:block;font-size:8px;font-weight:900;letter-spacing:.11em;color:var(--accent-ink);margin-bottom:4px}
.restaurant-arrival .arrival-info b{font-size:12px}
.restaurant-arrival .arrival-info p{font-size:9px;color:var(--sub);line-height:1.45;margin:4px 0 0}
.restaurant-arrival .arrival-info button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 9px;font-size:8px;font-weight:900;cursor:pointer}
.store-missing{min-height:250px;border-radius:22px;background:#e9eeee;border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:30px}
.store-missing b{display:block;font-size:18px;letter-spacing:-.03em;margin-bottom:7px}
.store-missing p{font-size:10px;color:var(--sub);line-height:1.55;margin:0;max-width:36ch}
.store-missing .addr{display:inline-block;margin-top:11px;padding:7px 9px;border-radius:10px;background:#fff;font-size:9px;font-weight:850}
.food-section{margin-top:22px}
.food-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.food-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.food-card img{width:100%;height:190px;object-fit:cover;background:#e4e9e9}
.food-card .fc-copy{padding:10px 11px 11px}
.food-card b{font-size:11px}
.food-card span{display:block;font-size:8px;color:var(--sub);line-height:1.45;margin-top:4px}
.food-card.placeholder{min-height:246px;display:grid;place-items:center;text-align:center;padding:20px}
.food-card.placeholder b{font-size:13px}
.food-card.placeholder span{max-width:24ch}
.recognition-note{font-size:8px;color:#6f7a7b;margin-top:6px;line-height:1.45}
@media(max-width:520px){
  .restaurant-arrival .arrival-photo img{height:250px}
  .food-gallery{grid-template-columns:1fr}
  .food-card img{height:220px}
}

@media(min-width:760px){.article{padding-left:28px;padding-right:28px}.actions{margin-left:-28px;margin-right:-28px;padding-left:28px;padding-right:28px}}
</style>
</head>

function setTop(t,b=false){$("#pageTitle").textContent=t;$("#backBtn").classList.toggle("hidden",!b)}
function nav(x){$("#navTrip").classList.toggle("active",x==="trip");$("#navDay").classList.toggle("active",x==="day");$("#navGuide").classList.toggle("active",x==="guide")}
function hideMain(){["tripView","dayView","guideView"].forEach(id=>$("#"+id).classList.add("hidden"))}
function showTrip(){hideMain();$("#tripView").classList.remove("hidden");setTop("MWY2026 · Interactive Trip Book");nav("trip");history.pushState({v:"trip"},"","#trip")}
function showGuide(){hideMain();$("#guideView").classList.remove("hidden");setTop("Guide",true);nav("guide");history.pushState({v:"guide"},"","#guide")}
function openDay(d){currentDay=d;mode="timeline";hideMain();$("#dayView").classList.remove("hidden");setTop(`Day ${d} · ${TRIP[d].title}`,true);nav("day");renderDay();history.pushState({v:"day",d,mode},"",`#day-${d}`)}
function switchDay(d){currentDay=d;renderDay();setTop(`Day ${d} · ${TRIP[d].title}`,true);history.replaceState({v:"day",d,mode},"",`#day-${d}-${mode}`)}
function setMode(m){mode=m;renderDay();history.replaceState({v:"day",d:currentDay,mode},"",`#day-${currentDay}-${mode}`)}

function renderDay(){
 const day=TRIP[currentDay], items=day.items;
 $("#dayTitle").textContent=`Day ${currentDay}`;$("#daySub").textContent=day.title;
 document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("active",+b.dataset.d===currentDay));
 $("#tBtn").classList.toggle("active",mode==="timeline");$("#mBtn").classList.toggle("active",mode==="map");
 $("#timelinePane").classList.toggle("hidden",mode!=="timeline");$("#mapPane").classList.toggle("hidden",mode!=="map");
 $("#timelinePane").innerHTML=`<div class="timeline">${items.map((x,i)=>`
  <div class="stop" id="stop-${currentDay}-${i}"><span class="dot"></span>
   <div class="row ${selected[currentDay]===i?"selected":""}" onclick="selectTimeline(${i})">

    <div class="row-actions"><button class="locate" onclick="event.stopPropagation();locateStop(${i})">Map</button><div class="kind">›</div></div></div>
   </div></div>${i<items.length-1?`<div class="linker">${x.move}</div>`:""}`).join("")}</div>
  ${currentDay===2?'<div class="recheckline">MWY：場販資料已鎖定；Camera / Bag / Re-entry 仍維持 TBA / UNCONFIRMED。</div>':""}`;
 if(mode==="map"){renderMap();setTimeout(initMap,0)}
}

function selectTimeline(i){selected[currentDay]=i;openDetail(TRIP[currentDay].items[i].id)}
function locateStop(i){selected[currentDay]=i;mode="map";renderDay();setTimeout(()=>selectMapStop(i,true),120)}
function goTimeline(){mode="timeline";renderDay();requestAnimationFrame(()=>document.getElementById(`stop-${currentDay}-${selected[currentDay]}`)?.scrollIntoView({behavior:"smooth",block:"center"}))}
function renderMap(){
 const items=TRIP[currentDay].items, x=items[selected[currentDay]]||items[0];
 $("#mapPane").innerHTML=`<div id="realMap"><div class="mapfallback">載入互動地圖…<br><small>MapLibre + OpenFreeMap · 零 API key</small></div></div>
 <div class="map-tools"><button onclick="fitDay()">顯示全日</button><button onclick="selectMapStop(0,true)">第一站</button><button onclick="selectMapStop(${items.length-1},true)">最後一站</button></div>

 <div class="recheckline">Map 只負責理解空間與 stop 關係。真正搭車／步行 routing 繼續交畀高德 point-to-point。</div>`;
}
function inspectorHTML(x){
 const i=TRIP[currentDay].items.indexOf(x);
 return `<div class="map-inspector"><small>SELECTED STOP ${i+1}/${TRIP[currentDay].items.length}</small><h3>${x.time} · ${x.title}</h3><p>${x.sub}<br>${x.address}${x.approx?" · pin 暫作近似":""}</p><div class="mi-actions"><button class="primary" onclick="openDetail('${x.id}')">詳細頁</button><button class="secondary" onclick="goTimeline()">回 Timeline</button></div></div>`;
}
function outOfChina(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271}
function transformLat(x,y){let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
function transformLng(x,y){let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
function gcjToWgs(lng,lat){if(outOfChina(lng,lat))return[lng,lat];const a=6378245,ee=.00669342162296594323,dLat=transformLat(lng-105,lat-35),dLng=transformLng(lng-105,lat-35),rad=lat/180*Math.PI,s=Math.sin(rad),m=1-ee*s*s,sm=Math.sqrt(m),mgLat=lat+(dLat*180)/((a*(1-ee))/(m*sm)*Math.PI),mgLng=lng+(dLng*180)/(a/sm*Math.cos(rad)*Math.PI);return[lng*2-mgLng,lat*2-mgLat]}
function initMap(){
 if(typeof maplibregl==="undefined"){document.querySelector("#realMap .mapfallback").innerHTML="MapLibre 未載入。正式 repo / GitHub Pages 再驗真地圖。";return}
 try{
  if(mapObj)mapObj.remove();mapMarkers=[];
  const items=TRIP[currentDay].items, coords=items.map(x=>gcjToWgs(...x.coord));
  mapObj=new maplibregl.Map({container:"realMap",style:"https://tiles.openfreemap.org/styles/liberty",center:coords[selected[currentDay]],zoom:13,attributionControl:true});
  mapObj.addControl(new maplibregl.NavigationControl({showCompass:true}),"top-right");
  mapObj.on("load",()=>{
    mapMarkers=items.map((x,i)=>{
      const el=document.createElement("div");el.className="trip-marker"+((x.kind==="Event"||x.kind==="Concert")?" event":"")+(selected[currentDay]===i?" selected":"");el.textContent=i+1;
      el.onclick=()=>selectMapStop(i,true);
      return new maplibregl.Marker({element:el}).setLngLat(coords[i]).addTo(mapObj)
    });
    mapObj.addSource("route",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:coords}}});
    mapObj.addLayer({id:"route-line",type:"line",source:"route",paint:{"line-color":"#169f99","line-width":3,"line-opacity":.65,"line-dasharray":[1.2,1.5]}});
    fitDay();setTimeout(()=>selectMapStop(selected[currentDay],false),300)
  });
 }catch(e){document.getElementById("realMap").innerHTML='<div class="mapfallback">真地圖喺目前預覽環境載入唔到。RC1 code 已保留完整 MapLibre 聯動。</div>'}
}
function fitDay(){if(!mapObj)return;const cs=TRIP[currentDay].items.map(x=>gcjToWgs(...x.coord));const b=cs.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(cs[0],cs[0]));mapObj.fitBounds(b,{padding:58,maxZoom:14,duration:500})}
function selectMapStop(i,fly){
 selected[currentDay]=i;const x=TRIP[currentDay].items[i];
 if($("#mapInspector"))$("#mapInspector").innerHTML=inspectorHTML(x);
 mapMarkers.forEach((m,j)=>m.getElement().classList.toggle("selected",j===i));
 if(fly&&mapObj)mapObj.flyTo({center:gcjToWgs(...x.coord),zoom:15,duration:550});
}

 <h2>118F 寬幅 Panorama</h2><div class="pano"><div class="panoview" id="panoView"><img id="panoImg" src="${IMG.towerPano}" onload="initPano()" onerror="this.style.display='none'"><div class="panotag">拖住左右移動 · 寬幅 panorama，非360°</div></div><div class="caption">原圖係118F實拍寬幅拼接，heading 約323°。未搵到真正完整360素材之前，唔會假裝係360。</div></div>

const towerViews={
 nw:{src:IMG.towerNW,label:"西北 · 外灘 / 黃浦江",meta:"heading 約321°。可見外灘、黃浦江、東方明珠。",pos:"center"},
 se:{src:IMG.towerSE,label:"東南 · 浦東腹地",meta:"heading 約147°。城市由陸家嘴向東南延伸。",pos:"center"},
 swfc:{src:IMG.towerSWFC,label:"俯視 · 環球金融中心",meta:"118F直接望落SWFC，最容易理解546m高度差。",pos:"center"},
 jinmao:{src:IMG.towerJinmao,label:"北偏西 · 金茂俯視",meta:"heading 約346°。金茂大廈直接落在腳下。",pos:"center"},
 inside:{src:IMG.towerInside,label:"118F 室內 / 玻璃",meta:"睇清楚實際落地玻璃與室內反光環境。",pos:"center"}
};
function switchTower(k,btn){const v=towerViews[k],im=$("#towerMain");if(!im)return;im.style.opacity=.2;setTimeout(()=>{im.src=v.src;im.style.objectPosition=v.pos;im.style.transform="scale(1)";im.style.opacity=1},100);$("#towerLabel").textContent=v.label;$("#towerMeta").textContent=v.meta;document.querySelectorAll(".viewtabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");document.querySelectorAll(".lenstabs button").forEach((b,i)=>b.classList.toggle("active",i===0))}
function towerLens(mm,btn){const im=$("#towerMain");if(!im)return;im.style.transform=`scale(${mm===24?1:mm===50?2.05:4.7})`;document.querySelectorAll(".lenstabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active")}
let pano={x:0,startX:0,startPos:0,drag:false,min:0};
function initPano(){const v=$("#panoView"),im=$("#panoImg");if(!v||!im)return;const reset=()=>{pano.min=Math.min(0,v.clientWidth-im.clientWidth);pano.x=pano.min/2;im.style.transform=`translateX(${pano.x}px)`};reset();window.addEventListener("resize",reset);v.onpointerdown=e=>{pano.drag=true;pano.startX=e.clientX;pano.startPos=pano.x;v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(!pano.drag)return;pano.x=Math.max(pano.min,Math.min(0,pano.startPos+(e.clientX-pano.startX)));im.style.transform=`translateX(${pano.x}px)`};v.onpointerup=v.onpointercancel=()=>pano.drag=false}

 return `${status("LATE-OCT RECHECK","warn")}<h1>徐家匯 ACG / Tech</h1><p class="deck">唔係三個商場由地下行到頂。每個點角色完全唔同，只去最值錢嗰層。</p>

 <div id="venueCard">${venueCard("happy")}</div>
 <div class="warnbox"><b>TODAY'S IP 決定停留時間</b><p>10月底重查 Miku / PJSK / 遊戲 IP。撞正真正有興趣活動就延長；普通商場內容就照 schedule 離開。</p></div>${hop("美羅城 / TPY","海金滋 進賢路240號")}${actions("美羅城","肇嘉浜路1111號")}`;
}
function venueCard(k){
 const d={
  happy:{img:IMG.happy,title:"美羅城 5–6F",text:"HAPPY MALL、動漫主題影院、XR／互動內容。三站之中最適合當主娛樂站。"},
  tpy:{img:IMG.tpy,title:"TPY Center B2",text:"二次元街、谷店、卡牌、扭蛋、快閃；上層科技內容按興趣先睇。"},
  young:{img:IMG.young,title:"新六百YOUNG",text:"先睇外部1000㎡級8K裸眼3D大屏。只有當期 IP 活動值得先深入室內。"}
 }[k];
 return `<div class="venue-card"><img src="${d.img}" onerror="this.style.display='none'"><div class="venue-copy"><h3>${d.title}</h3><p>${d.text}</p></div></div>`;

function xjhVenue(k,btn){$("#venueCard").innerHTML=venueCard(k);document.querySelectorAll(".venue-tabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active")}

function openDetail(id){
 const fn=P[id]||(()=>`<h1>${id}</h1><p class="deck">待編輯。</p>`);$("#article").innerHTML=fn();
 const item=Object.values(TRIP).flatMap(d=>d.items).find(x=>x.id===id);$("#detailTitle").textContent=item?.title||id;$("#detail").classList.add("open");detailOpen=true;$("#detail").scrollTop=0;
 history.pushState({v:"detail",id},"",location.hash+"-detail")
}
function closeDetail(){if(!detailOpen)return;$("#detail").classList.remove("open");detailOpen=false;if(history.state?.v==="detail")history.back()}
function copyText(t){navigator.clipboard?.writeText(t);const old=document.title;document.title="已複製 · "+t;setTimeout(()=>document.title=old,800)}
window.addEventListener("popstate",e=>{if(detailOpen){$("#detail").classList.remove("open");detailOpen=false;return}const s=e.state;if(!s||s.v==="trip"){hideMain();$("#tripView").classList.remove("hidden");setTop("MWY2026 · Interactive Trip Book");nav("trip");return}if(s.v==="day"){currentDay=s.d;mode=s.mode||"timeline";hideMain();$("#dayView").classList.remove("hidden");setTop(`Day ${currentDay} · ${TRIP[currentDay].title}`,true);nav("day");renderDay();return}if(s.v==="guide"){hideMain();$("#guideView").classList.remove("hidden");setTop("Guide",true);nav("guide")}});
init();
</script>
