function loadExternalScript(src,timeout=4500){return new Promise(resolve=>{const el=document.createElement('script');let done=false;const finish=ok=>{if(done)return;done=true;clearTimeout(timer);resolve(ok)};const timer=setTimeout(()=>{el.remove();finish(false)},timeout);el.src=src;el.async=true;el.onload=()=>finish(true);el.onerror=()=>finish(false);document.head.appendChild(el)})}
function ensureMapLibre(){
 if(window.maplibregl)return Promise.resolve(true);
 if(maplibrePromise)return maplibrePromise;
 maplibrePromise=(async()=>{
  if(!document.getElementById('maplibre-css')){
   const css=document.createElement('link');css.id='maplibre-css';css.rel='stylesheet';css.href='https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css';css.onerror=()=>{css.onerror=null;css.href='https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css'};document.head.appendChild(css);
  }
  let ok=await loadExternalScript('https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js');
  if(!ok&&!window.maplibregl)ok=await loadExternalScript('https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js');
  const ready=!!window.maplibregl;
  if(!ready)setTimeout(()=>{maplibrePromise=null},0);
  return ready;
 })();
 return maplibrePromise;
}

function esc(s=''){return String(s).replaceAll('\\','\\\\').replaceAll("'","\\'")}
function factRows(items=[]){return items.map(([a,b])=>`<div class="fact"><small>${a}</small><b>${b}</b></div>`).join("")}

function decisionDiagram(title,items){return `<div class="decision-diagram"><div class="decision-head"><span>CHECKPOINT</span><strong>${title}</strong></div><div class="decision-grid">${items.map(x=>`<div class="decision-path ${x[2]||""}"><b>${x[0]}</b><p>${x[1]}</p></div>`).join("")}</div></div>`}

 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&detailOpen)closeDetail()});
}
function dayCard(d){const x=DAYS[d];return `<button class="day-card" onclick="openDay(${d})"><img src="${x.cover}" alt="" loading="lazy" decoding="async" onerror="this.remove()"><span class="day-index" aria-hidden="true">0${d}</span><span class="day-arrow">›</span><div class="day-copy"><small>第${d}日 · ${x.date.split(' · ')[0]}</small><b>${x.title}</b><span>${dayCardSub(d)}</span></div></button>`}
function dayCardSub(d){return d===1?'抵達 → 外灘深藍／亮燈 → 浦東反拍 → Freedom':d===2?'早餐 → 場販／展示 → 19:00 VIP 夜場':'葱油餅 → 武康 → 徐家匯 → 張園 → PVG'}
function shanghaiClock(){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return{date:`${parts.year}-${parts.month}-${parts.day}`,minutes:+parts.hour*60+(+parts.minute)}}
function todayTripDay(){return {'2026-10-31':1,'2026-11-01':2,'2026-11-02':3}[shanghaiClock().date]||0}
function stopMinutes(t=''){const m=String(t).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):9999}
function liveStripHTML(){if(todayTripDay()!==currentDay)return'';const now=shanghaiClock().minutes,items=DAYS[currentDay].items;let idx=-1;for(let i=0;i<items.length;i++)if(stopMinutes(items[i].time)<=now)idx=i;const cur=idx>=0?items[idx]:null,nxt=items[idx+1]||null;if(!cur&&nxt)return `<div class="live-strip"><button class="live-jump next" aria-label="下一站：${nxt.title}" onclick="openDetail('${nxt.id}')"><b>下一站 · ${nxt.time} · ${nxt.title}</b><span>${nxt.sub}</span></button></div>`;if(cur&&nxt)return `<div class="live-strip"><button class="live-jump current" aria-label="目前：${cur.title}" onclick="openDetail('${cur.id}')"><b>現在 · ${cur.time} · ${cur.title}</b><span>${cur.sub}</span></button><button class="live-jump next" aria-label="下一站：${nxt.title}" onclick="openDetail('${nxt.id}')"><b>下一站 · ${nxt.time} · ${nxt.title}</b><span>${nxt.sub}</span></button></div>`;if(cur)return `<div class="live-done"><b>現在 · ${cur.time} · ${cur.title}</b>。今日行程已到最後一站。</div>`;return''}
function refreshLiveStrip(){const e=$('#liveStrip');if(e&&!$('#dayView').classList.contains('hidden'))e.innerHTML=liveStripHTML()}
function setTop(t,b=false){$('#pageTitle').textContent=t;$('#backBtn').classList.toggle('hidden',!b)}
function nav(x){[['navTrip','trip'],['navDay','day'],['navGuide','guide']].forEach(([id,key])=>{const el=$('#'+id),active=x===key;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')})}
function hideMain(){['tripView','dayView','guideView'].forEach(id=>$('#'+id).classList.add('hidden'))}
function resetMainScroll(){window.scrollTo({top:0,left:0,behavior:'instant'})}
function showTrip(push=true){hideMain();$('#tripView').classList.remove('hidden');setTop('MWY2026 · 上海三日行程書');nav('trip');resetMainScroll();if(push)history.pushState({v:'trip'},'','#trip')}
function showGuide(push=true){hideMain();$('#guideView').classList.remove('hidden');setTop('指南',true);nav('guide');resetMainScroll();if(push)history.pushState({v:'guide'},'','#guide')}
function openDay(d,push=true){currentDay=d;mode='timeline';hideMain();$('#dayView').classList.remove('hidden');setTop(`第${d}日 · ${DAYS[d].title}`,true);nav('day');renderDay();resetMainScroll();if(push)history.pushState({v:'day',d,mode},'',`#day-${d}`)}
function switchDay(d){currentDay=d;renderDay();setTop(`第${d}日 · ${DAYS[d].title}`,true);resetMainScroll();history.replaceState({v:'day',d,mode},'',`#day-${d}-${mode}`)}
function setMode(m){mode=m;renderDay();resetMainScroll();history.replaceState({v:'day',d:currentDay,mode},'',`#day-${currentDay}-${mode}`)}
function renderDay(){const day=DAYS[currentDay];$('#dayView').dataset.day=String(currentDay);$('#dayTitle').textContent=`第${currentDay}日`;$('#daySub').textContent=day.title;$('#dayDate').textContent=day.date;$('#liveStrip').innerHTML=liveStripHTML();document.querySelectorAll('.seg button').forEach(b=>{const active=+b.dataset.d===currentDay;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});const timelineActive=mode==='timeline';$('#tBtn').classList.toggle('active',timelineActive);$('#mBtn').classList.toggle('active',!timelineActive);$('#tBtn').setAttribute('aria-pressed',String(timelineActive));$('#mBtn').setAttribute('aria-pressed',String(!timelineActive));$('#timelinePane').classList.toggle('hidden',!timelineActive);$('#mapPane').classList.toggle('hidden',timelineActive);if(timelineActive)renderTimeline();else{renderMap();setTimeout(initMap,30)}}
function renderTimeline(){const items=DAYS[currentDay].items,live=todayTripDay()===currentDay,now=shanghaiClock().minutes;let currentIdx=-1;if(live){for(let i=0;i<items.length;i++)if(stopMinutes(items[i].time)<=now)currentIdx=i}$('#timelinePane').innerHTML=`<div class="timeline">${items.map((x,i)=>{const state=!live?"":i<currentIdx?"is-past":i===currentIdx?"is-now":i===currentIdx+1?"is-next":"";return `${i?`<div class="route-link ${live&&i<=currentIdx?"is-past":""}">${items[i-1].move||''}</div>`:''}<div class="stop ${x.anchor?'major':'minor'} ${state}"><div class="stop-time">${x.time}</div><div class="stop-track"><div class="stop-dot ${x.anchor?'anchor':''}"></div></div><button class="stop-card" ${state==="is-now"?'aria-current="step"':''} onclick="openDetail('${x.id}')">${x.anchor?`<span class="stop-kind">${x.kind}</span>`:''}<h3>${x.title}</h3><p>${x.sub}</p></button></div>`}).join('')}</div>`}

function renderMap(){const mapped=DAYS[currentDay].items.filter(x=>x.coord);const x=mapped[selected[currentDay]]||mapped[0];$('#mapPane').innerHTML=`<div id="realMap"><div class="mapfallback">載入互動地圖…<br><small>地圖只用嚟理解站點位置；實際導航交畀高德。</small></div></div><div class="map-tools"><button onclick="fitDay()">顯示全日</button><button onclick="selectMapStop(0,true)">第一站</button><button onclick="selectMapStop(${Math.max(0,mapped.length-1)},true)">最後一站</button></div><div id="mapInspector">${inspectorHTML(x,mapped)}</div><div class="map-note">地圖唔負責即時路況／轉乘。地址同現場時間規則先係行程書主資料。</div>`}
function inspectorHTML(x,mapped){if(!x)return'';const i=mapped.indexOf(x);return `<div class="map-inspector"><small>站點 ${i+1}/${mapped.length}</small><h3>${x.time} · ${x.title}</h3><p>${x.sub}${x.address?`<br>${x.address}`:''}</p><div class="map-actions"><button class="primary" onclick="openDetail('${x.id}')">打開詳細頁</button><button class="secondary" onclick="goTimeline()">回時間線</button></div></div>`}
function outOfChina(lng,lat){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271}
function transformLat(x,y){let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
function transformLng(x,y){let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
function gcjToWgs(lng,lat){if(outOfChina(lng,lat))return[lng,lat];const a=6378245,ee=.00669342162296594323,dLat=transformLat(lng-105,lat-35),dLng=transformLng(lng-105,lat-35),rad=lat/180*Math.PI,s=Math.sin(rad),m=1-ee*s*s,sm=Math.sqrt(m),mgLat=lat+(dLat*180)/((a*(1-ee))/(m*sm)*Math.PI),mgLng=lng+(dLng*180)/(a/sm*Math.cos(rad)*Math.PI);return[lng*2-mgLng,lat*2-mgLat]}
async function initMap(){const mapped=DAYS[currentDay].items.filter(x=>x.coord),box=document.getElementById('realMap');const libReady=await ensureMapLibre();if(!libReady||!box?.isConnected){if(box)box.innerHTML='<div class="mapfallback">地圖元件載入失敗。可直接複製地址去高德。</div>';return}try{if(mapObj)mapObj.remove();mapMarkers=[];const coords=mapped.map(x=>gcjToWgs(...x.coord));box.innerHTML='';mapObj=new maplibregl.Map({container:box,style:OSM_RASTER_STYLE,center:coords[selected[currentDay]]||coords[0],zoom:12,attributionControl:true});mapObj.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');let ready=false;const failTimer=setTimeout(()=>{if(!ready&&box)box.innerHTML='<div class="mapfallback">底圖載入逾時；站點資料仍可用，導航請交畀高德。</div>'},8000);mapObj.on('load',()=>{ready=true;clearTimeout(failTimer);mapMarkers=mapped.map((x,i)=>{const el=document.createElement('div');el.className='trip-marker'+(x.anchor?' anchor':'')+(selected[currentDay]===i?' selected':'');el.textContent=i+1;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',`${i+1}. ${x.time} ${x.title}`);el.onclick=()=>selectMapStop(i,true);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectMapStop(i,true)}};return new maplibregl.Marker({element:el}).setLngLat(coords[i]).addTo(mapObj)});if(coords.length>1){mapObj.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:coords}}});mapObj.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#169f99','line-width':3,'line-opacity':.65,'line-dasharray':[1.2,1.5]}})}fitDay()})}catch(e){if(box)box.innerHTML='<div class="mapfallback">地圖喺目前環境載入唔到；詳細頁同地址複製功能仍可正常用。</div>'}}
function fitDay(){if(!mapObj)return;const cs=DAYS[currentDay].items.filter(x=>x.coord).map(x=>gcjToWgs(...x.coord));if(!cs.length)return;if(cs.length===1){mapObj.flyTo({center:cs[0],zoom:14});return}const b=cs.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(cs[0],cs[0]));mapObj.fitBounds(b,{padding:55,maxZoom:14,duration:350})}
function selectMapStop(i,fly){const mapped=DAYS[currentDay].items.filter(x=>x.coord);selected[currentDay]=i;const x=mapped[i];if($('#mapInspector'))$('#mapInspector').innerHTML=inspectorHTML(x,mapped);mapMarkers.forEach((m,j)=>m.getElement().classList.toggle('selected',j===i));if(fly&&mapObj&&x)mapObj.flyTo({center:gcjToWgs(...x.coord),zoom:14.5,duration:450})}
function goTimeline(){setMode('timeline')}

function guideHTML(){return `<div class="guide-intro"><h2>出發前</h2><p>以下幾樣會隨時間改變，臨出發再確認一次就夠。</p></div>
<div class="guide-group"><h3>要再確認</h3><div class="status-list">
<div class="status-row"><div class="state">MWY</div><div><b>相機、袋、安檢、再次入場</b><p>等主辦最終公告；Day 2 出門前確認。</p></div></div>
<div class="status-row"><div class="state">10/31</div><div><b>外灘景觀燈</b><p>確認當晚亮燈安排，同日落／藍調時段一齊睇。</p></div></div>
<div class="status-row"><div class="state">輪渡</div><div><b>東金線班次</b><p>前一晚再睇班次同有冇臨時停航。</p></div></div>
<div class="status-row"><div class="state">Freedom</div><div><b>夜間演出時間</b><p>出發前確認當日場次；19:45左右到南廣場。</p></div></div>
<div class="status-row"><div class="state">食店</div><div><b>當日有冇休息／提早收舖</b><p>萊萊、泰康、東泰祥、張師傅、琪琪、小楊、王記、海金滋、味香齋。</p></div></div>
</div></div>
<div class="guide-group"><h3>拖延時點處理</h3><div class="status-list">
<div class="status-row"><div class="state">Day 1</div><div><b>15:45後唔再等食</b><p>先保16:10外白渡橋、外灘藍調時段同19:45 Freedom。</p></div></div>
<div class="status-row"><div class="state">Day 3</div><div><b>15:15收機</b><p>返住宿取行李；15:30–15:40出發去PVG較舒服。</p></div></div>
</div></div>
<div class="guide-group"><h3>備用方案</h3><div class="status-list">
<button class="guide-action" onclick="openDetail('tower')"><span class="state">備用</span><span><b>上海之巔 118F</b><p>正常唔去；只有能見度極佳＋時間異常充裕先臨時考慮。</p></span><em>打開 ›</em></button>
</div></div>
<div class="guide-group"><h3>住宿與返程</h3><div class="status-list">
<div class="status-row"><div class="state">住宿</div><div><b>如家商旅酒店（上海火車站南廣場店）</b><p>Day 2如果相機禁帶，先問前台貴重物品寄存。</p></div></div>
<div class="status-row"><div class="state">返程</div><div><b>11/2 · 19:05 · PVG T2</b><p>15:30–15:40由住宿出發；15:50只當最遲正常值。</p></div></div>
</div></div>`}

async function initDetailPhotoMap(id){if(detailMapObj){try{detailMapObj.remove()}catch(e){}detailMapObj=null}const cfg=PHOTO_MAPS[id],el=document.getElementById(`photoMap-${id}`);if(!cfg||!el)return;const libReady=await ensureMapLibre();if(!libReady||!el?.isConnected){if(el)el.innerHTML='<div class="photo-map-fallback">地圖元件載入唔到；下面嘅站位／焦段仍然可用。</div>';return}try{const pts=cfg.points.map(p=>p.wgs);el.innerHTML='';detailMapObj=new maplibregl.Map({container:el,style:OSM_RASTER_STYLE,center:pts[0],zoom:cfg.zoom||15,interactive:false,attributionControl:true});let ready=false;const failTimer=setTimeout(()=>{if(!ready)el.innerHTML='<div class="photo-map-fallback">機位底圖載入逾時；用下面站位名稱去高德認位即可。</div>'},8000);detailMapObj.on('load',()=>{ready=true;clearTimeout(failTimer);cfg.points.forEach(p=>{const m=document.createElement('div');m.className='photo-pin'+(p.hot?' hot':'');m.textContent=p.label;m.title=p.name;new maplibregl.Marker({element:m}).setLngLat(p.wgs).addTo(detailMapObj)});if(pts.length>1){detailMapObj.addSource('photo-route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:pts}}});detailMapObj.addLayer({id:'photo-route-line',type:'line',source:'photo-route',paint:{'line-color':'#0f9f97','line-width':3,'line-opacity':.8,'line-dasharray':[1.1,1.2]}});const b=pts.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(pts[0],pts[0]));detailMapObj.fitBounds(b,{padding:42,maxZoom:cfg.zoom||15,duration:0})}})}catch(e){el.innerHTML='<div class="photo-map-fallback">機位圖喺目前環境載入唔到；用下面站位名稱去高德認位即可。</div>'}}
function openDetail(id,push=true){const fn=P[id]||(()=>`${pageHead('詳細頁',id,'暫未有內容。')}`);detailCurrentId=id;$('#detail').dataset.detail=id;$('#article').innerHTML=fn()+detailPagerHTML(id);$('#detailTitle').textContent=PAGE_META[id]?.title||id;$('#detail').classList.add('open');$('#detail').setAttribute('aria-hidden','false');document.body.classList.add('detail-active');detailOpen=true;$('#detail').scrollTop=0;setTimeout(()=>initDetailPhotoMap(id),35);if(push)history.pushState({v:'detail',id},'',`#detail-${id}`)}
function closeDetail(){if(!detailOpen)return;$('#detail').classList.remove('open');$('#detail').setAttribute('aria-hidden','true');document.body.classList.remove('detail-active');detailOpen=false;if(history.state?.v==='detail')history.back()}
let toastTimer=null;
function showToast(message){const el=$('#toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1300)}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
async function copyText(t){let ok=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(t);ok=true}}catch(e){}if(!ok)ok=legacyCopy(t);const shown=String(t).length>24?String(t).slice(0,24)+'…':String(t);showToast(ok?'已複製 · '+shown:'未能自動複製，請長按地址')}
function restoreFromHash(){const h=location.hash;if(h.startsWith('#detail-')){const id=h.replace('#detail-','');openDay(findDayForId(id),false);openDetail(id,false);history.replaceState({v:'detail',id},'',h);return}if(h.startsWith('#day-')){const m=h.match(/^#day-(\d)(?:-(map|timeline))?$/);if(m){currentDay=+m[1];mode=m[2]||'timeline';hideMain();$('#dayView').classList.remove('hidden');setTop(`第${currentDay}日 · ${DAYS[currentDay].title}`,true);nav('day');renderDay();history.replaceState({v:'day',d:currentDay,mode},'',h);return}}if(h==='#guide'){showGuide(false);history.replaceState({v:'guide'},'',h);return}showTrip(false)}
function findDayForId(id){for(const [d,x] of Object.entries(DAYS))if(x.items.some(i=>i.id===id))return +d;return 1}
window.addEventListener('popstate',e=>{if(detailOpen&&e.state?.v!=='detail'){$('#detail').classList.remove('open');$('#detail').setAttribute('aria-hidden','true');document.body.classList.remove('detail-active');detailOpen=false}const s=e.state;if(!s||s.v==='trip'){showTrip(false);return}if(s.v==='day'){currentDay=s.d;mode=s.mode||'timeline';hideMain();$('#dayView').classList.remove('hidden');setTop(`第${currentDay}日 · ${DAYS[currentDay].title}`,true);nav('day');renderDay();return}if(s.v==='guide'){showGuide(false);return}if(s.v==='detail'){const d=findDayForId(s.id);openDay(d,false);openDetail(s.id,false)}});
init();
