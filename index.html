 maplibrePromise=(async()=>{

const $=s=>document.querySelector(s);

function esc(s=''){return String(s).replaceAll('\\','\\\\').replaceAll("'","\\'")}
function factRows(items=[]){return items.map(([a,b])=>`<div class="fact"><small>${a}</small><b>${b}</b></div>`).join("")}
function pageHead(kicker,title,deck,facts=[]){const key=facts.slice(0,2),rest=facts.slice(2);return `<div class="page-kicker">${kicker}</div><h1>${title}</h1><p class="deck">${deck}</p>${key.length?`<div class="facts">${factRows(key)}</div>`:""}${rest.length?`<details class="facts-more"><summary>快速資料</summary><div class="facts">${factRows(rest)}</div></details>`:""}`}
function media(src,cap,pos="center"){return `<div class="media"><img src="${src}" alt="${cap||""}" loading="lazy" decoding="async" style="object-position:${pos}" onerror="this.closest('.media').classList.add('missing');this.remove()"></div>${cap?`<div class="caption">${cap}</div>`:""}`}
function block(title,content){return `<section class="block"><h2 class="block-title">${title}</h2>${content}</section>`}
function editorialRoute(items){return `<div class="editorial-route" aria-label="路線節點">${items.map((x,i)=>`<div class="editorial-node"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div>`}
function transportDiagram(items,fallback=null){return `<div class="transport-diagram" role="img" aria-label="${items.map(x=>x[0]).join("，再到")}">${items.map((x,i)=>`<div class="transport-stop"><div class="transport-node"><span>${x[1]||String(i+1).padStart(2,"0")}</span></div><div class="transport-copy"><b>${x[0]}</b>${x[2]?`<p>${x[2]}</p>`:""}${i<items.length-1&&x[3]?`<em>${x[3]}</em>`:""}</div></div>`).join("")}${fallback?`<div class="transport-fallback"><strong>${fallback[0]}</strong><p>${fallback[1]}</p></div>`:""}</div>`}
function decisionDiagram(title,items){return `<div class="decision-diagram"><div class="decision-head"><span>CHECKPOINT</span><strong>${title}</strong></div><div class="decision-grid">${items.map(x=>`<div class="decision-path ${x[2]||""}"><b>${x[0]}</b><p>${x[1]}</p></div>`).join("")}</div></div>`}

function lead(title,sub,badge=""){return `<div class="lead-action"><div><strong>${title}</strong>${sub?`<p>${sub}</p>`:""}</div>${badge?`<div class="badge">${badge}</div>`:""}</div>`}
function rules(rows){return `<div class="rule-list">${rows.map(r=>`<div class="rule"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("")}</div>`}
function branches(items){return `<div class="branch-grid">${items.map(x=>`<div class="branch ${x[2]||''}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>`}
function order(img,title,note,label="今次點法"){return img?`<div class="order-card"><img src="${img}" alt="${title}" loading="lazy" decoding="async" onerror="this.remove()"><div><small>${label}</small><strong>${title}</strong><p>${note}</p></div></div>`:`<div class="order-textonly"><small>${label}</small><strong>${title}</strong><p>${note}</p></div>`}
function cutoff(title,note,label=""){return `<div class="cutoff"><strong>${title}</strong><p>${note}</p></div>`}
function route(rows){return `<div class="route-stack">${rows.map(r=>`<div class="route-step"><div class="t">${r[0]}</div><div class="track"></div><div><h3>${r[1]}</h3><p>${r[2]}</p></div></div>`).join("")}</div>`}
function shots(rows){return `<div class="shot-list">${rows.map(r=>`<div class="shot"><div class="lens">${r[0]}</div><div><h3>${r[1]}</h3><p>${r[2]}</p></div></div>`).join("")}</div>`}
function weather(items){return `<div class="weather-grid">${items.map(x=>`<div class="weather ${x[2]||''}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>`}
function compare(items){return `<div class="compare">${items.map(x=>`<div><small>${x[0]}</small><strong>${x[1]}</strong><p>${x[2]}</p></div>`).join("")}</div>`}
function alertBox(title,note,danger=false){return `<div class="alert ${danger?'danger':''}"><strong>${title}</strong><p>${note}</p></div>`}
function more(items){return `<div class="disclosure">${items.map(x=>`<details><summary>${x[0]}</summary><div class="more">${x[1]}</div></details>`).join("")}</div>`}
function nextHop(a,b,copyA=a,copyB=b){return copyB?`<div class="next-hop compact"><strong>${b}</strong><p>${copyB}</p><div class="next-actions"><button class="a" onclick="copyText('${esc(copyB)}')">複製目的地</button></div></div>`:""}
function copyPlaces(items){return `<div class="copy-places">${items.map(x=>`<button class="copy-place" onclick="copyText('${esc(x[1])}')"><b>${x[0]}</b><span>${x[1]}</span><em>複製</em></button>`).join("")}</div>`}
function sticky(){return""}
function findItemPosition(id){for(const [d,day] of Object.entries(DAYS)){const i=day.items.findIndex(x=>x.id===id);if(i>=0)return{day:+d,index:i,items:day.items}}return null}
function detailPagerHTML(id){const p=findItemPosition(id);if(!p)return"";const prev=p.items[p.index-1]||null,next=p.items[p.index+1]||null;return `<nav class="detail-pager" aria-label="行程站點">${prev?`<button class="pager-prev" aria-label="上一站：${prev.title}" onclick="openAdjacentDetail(-1)"><small>← 上一站</small><b>${prev.title}</b></button>`:`<span></span>`}${next?`<button class="pager-next" aria-label="下一站：${next.title}" onclick="openAdjacentDetail(1)"><small>下一站 →</small><b>${next.title}</b></button>`:`<div class="pager-end"><b>最後一站</b></div>`}</nav>`}
function openAdjacentDetail(delta){const p=findItemPosition(detailCurrentId);if(!p)return;const target=p.items[p.index+delta];if(!target)return;openDetail(target.id,false);history.replaceState({...history.state,v:'detail',id:target.id},'',`#detail-${target.id}`)}
function mealExtras(rows){const useful=rows.filter(r=>r[0]!=="飲品");return useful.length?`<div class="meal-extras">${useful.map(r=>`<div class="meal-extra"><b>${r[0]} · ${r[1]}</b>${r[2]?`<p>${r[2]}</p>`:""}</div>`).join("")}</div>`:""}
function foodFeature(img,kicker,title,note,source=""){return `<div class="food-feature">${img?`<img src="${img}" alt="${title}" loading="lazy" decoding="async" onerror="this.remove()">`:""}<div class="food-feature-copy"><strong>${title}</strong><p>${note}</p>${source?`<a class="visual-source" href="${source}" target="_blank" rel="noopener noreferrer">圖源 ↗</a>`:""}</div></div>`}
function foodVisuals(items){return `<div class="food-visual-grid">${items.map(x=>`<figure class="food-visual"><img src="${x[0]}" alt="${x[1]}" loading="lazy" decoding="async" onerror="this.closest('.food-visual').classList.add('missing');this.remove()"><figcaption><strong>${x[1]}</strong><p>${x[2]}</p>${x[3]?`<a class="visual-source" href="${x[3]}" target="_blank" rel="noopener noreferrer">圖源 ↗</a>`:""}</figcaption></figure>`).join("")}</div>`}
function placeVisuals(items){return foodVisuals(items)}

function foodList(rows){return `<div class="food-list">${rows.map(r=>`<div class="food-row"><b>${r[0]} · ${r[1]}</b><p>${r[2]}</p></div>`).join("")}</div>`}
function eatSteps(rows){return `<div class="eat-steps">${rows.map(r=>`<div class="eat-step"><div><b>${r[0]}</b><p>${r[1]}</p></div></div>`).join("")}</div>`}
function guideAsset(src,alt){return `<div class="guide-asset"><img src="${src}" alt="${alt}" loading="lazy" decoding="async"></div>`}
function 例圖Gallery(items){return `<div class="ref-grid">${items.map((x,i)=>`<figure class="ref-card ${i===0?"featured":""}"><img src="${x[0]}" alt="${x[1]}" loading="lazy" decoding="async" onerror="this.remove()"><figcaption class="ref-copy"><small>${x[2]}</small><b>${x[1]}</b><p>${x[3]}</p>${x[5]?`<a class="ref-source" href="${x[5]}" target="_blank" rel="noopener noreferrer">原圖 ↗</a>`:""}</figcaption></figure>`).join("")}</div>`}
function photographerRefs(items){return `<details class="secondary-disclosure"><summary>更多構圖參考</summary><div class="pro-ref-grid">${items.map(x=>`<a class="pro-ref" href="${x[5]}" target="_blank" rel="noopener noreferrer"><small>${x[0]}</small><strong>${x[1]}</strong><p>${x[3]}</p></a>`).join("")}</div></details>`}
function photoMap(id){const cfg=PHOTO_MAPS[id];const legend=cfg?`<div class="photo-map-legend">${cfg.points.map(p=>`<span><b>${p.label}</b>${p.name}</span>`).join("")}</div>`:"";return `<div class="photo-map-wrap"><div class="photo-map" id="photoMap-${id}"><div class="photo-map-fallback">載入機位圖…</div></div>${legend}<details class="map-help"><summary>地圖用途</summary><p>只用嚟認街道、地標同機位相對位置；現場導航仍交畀高德。</p></details></div>`}

])}</details>`}

async function initDetailPhotoMap(id){if(detailMapObj){try{detailMapObj.remove()}catch(e){}detailMapObj=null}const cfg=PHOTO_MAPS[id],el=document.getElementById(`photoMap-${id}`);if(!cfg||!el)return;const libReady=await ensureMapLibre();if(!libReady||!el?.isConnected){if(el)el.innerHTML='<div class="photo-map-fallback">地圖元件載入唔到；下面嘅站位／焦段仍然可用。</div>';return}try{const pts=cfg.points.map(p=>p.wgs);el.innerHTML='';detailMapObj=new maplibregl.Map({container:el,style:OSM_RASTER_STYLE,center:pts[0],zoom:cfg.zoom||15,interactive:false,attributionControl:true});let ready=false;const failTimer=setTimeout(()=>{if(!ready)el.innerHTML='<div class="photo-map-fallback">機位底圖載入逾時；用下面站位名稱去高德認位即可。</div>'},8000);detailMapObj.on('load',()=>{ready=true;clearTimeout(failTimer);cfg.points.forEach(p=>{const m=document.createElement('div');m.className='photo-pin'+(p.hot?' hot':'');m.textContent=p.label;m.title=p.name;new maplibregl.Marker({element:m}).setLngLat(p.wgs).addTo(detailMapObj)});if(pts.length>1){detailMapObj.addSource('photo-route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:pts}}});detailMapObj.addLayer({id:'photo-route-line',type:'line',source:'photo-route',paint:{'line-color':'#336b88','line-width':3,'line-opacity':.8,'line-dasharray':[1.1,1.2]}});const b=pts.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(pts[0],pts[0]));detailMapObj.fitBounds(b,{padding:42,maxZoom:cfg.zoom||15,duration:0})}})}catch(e){el.innerHTML='<div class="photo-map-fallback">機位圖喺目前環境載入唔到；用下面站位名稱去高德認位即可。</div>'}}
let pendingDetailRestore=false;
function restoreDetailFocus(){
 if(!pendingDetailRestore)return;
 pendingDetailRestore=false;
 let target=detailReturnFocus?.element;
 if(!target?.isConnected||!target.getClientRects().length){target=[...$('.shell').querySelectorAll('button')].find(el=>el.getClientRects().length&&el.getAttribute('onclick')===detailReturnFocus?.onclick)}
 (target||(!$('#backBtn').classList.contains('hidden')?$('#backBtn'):$('.nav.active')))?.focus({preventScroll:true});
 window.scrollTo({top:detailReturnScroll,left:0,behavior:'instant'});
}
function hideDetail(){
 if($('#detail').contains(document.activeElement))document.activeElement.blur();
 $('#detail').classList.remove('open');$('#detail').inert=true;$('#detail').setAttribute('aria-hidden','true');
 $('.shell').inert=false;document.body.classList.remove('detail-active');detailOpen=false;pendingDetailRestore=true;
}
const LEGACY_DETAIL_ALIASES={xjh:"zx",zhangyuan:"hotelreturn"};
function openDetail(id,push=true,selectOrigin=true){
 id=LEGACY_DETAIL_ALIASES[id]||id;
 const fn=P[id];if(!fn)return;
 const wasOpen=detailOpen;
 if(!wasOpen){detailReturnFocus={element:document.activeElement,onclick:document.activeElement?.getAttribute('onclick')};detailReturnScroll=window.scrollY;detailReturnView=currentViewState()}
 if(!wasOpen&&selectOrigin&&DAYS[currentDay].items.some(x=>x.id===id)){selectedStopIds[currentDay]=id;selected[currentDay]=Math.max(0,mappedStops().findIndex(x=>x.id===id));document.querySelectorAll('.stop-card').forEach(button=>{const active=button.dataset.stopId===id;button.classList.toggle('selected',active);if(active)button.setAttribute('aria-current','true');else button.removeAttribute('aria-current')})}
 detailCurrentId=id;$('#detail').dataset.detail=id;$('#detail').dataset.kind=DETAIL_KIND[id]||'utility';$('#article').innerHTML=fn()+detailPagerHTML(id);$('#detailTitle').textContent=PAGE_META[id]?.title||id;
 $('#detailActions').innerHTML=detailActionHTML(id);
 $('#detail').inert=false;$('#detail').classList.add('open');$('#detail').setAttribute('aria-hidden','false');
 document.body.classList.add('detail-active');detailOpen=true;pendingDetailRestore=false;$('#detail').scrollTop=0;
 const heading=$('#article h1');heading?.setAttribute('tabindex','-1');
 (wasOpen?heading:$('#detail .dtop button'))?.focus({preventScroll:true});$('.shell').inert=true;
 setTimeout(()=>{if(detailOpen&&detailCurrentId===id)initDetailPhotoMap(id)},35);
 if(push)history.pushState({v:'detail',id,from:detailReturnView,hasParent:true},'',`#detail-${id}`);
}
function closeDetail(){
 if(!detailOpen)return;
 const state=history.state,from=state?.from||detailReturnView||{v:'day',d:findDayForId(detailCurrentId),mode:'timeline'};
 hideDetail();
 if(state?.v==='detail'&&state.hasParent){history.back();return}
 renderViewState(from);history.replaceState(from,'',viewHash(from));restoreDetailFocus();
}
let toastTimer=null;
function showToast(message){const el=$('#toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1300)}
function legacyCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
async function copyText(t){let ok=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(t);ok=true}}catch(e){}if(!ok)ok=legacyCopy(t);const shown=String(t).length>24?String(t).slice(0,24)+'…':String(t);showToast(ok?'已複製 · '+shown:'未能自動複製，請長按地址')}
function restoreFromHash(){
 const h=location.hash,prior=history.state;
 if(h.startsWith('#detail-')){
  const id=LEGACY_DETAIL_ALIASES[h.slice(8)]||h.slice(8);
  if(P[id]){const from=prior?.v==='detail'&&prior.from?prior.from:id==='tower'?{v:'guide'}:{v:'day',d:findDayForId(id),mode:'timeline'};renderViewState(from);history.replaceState(from,'',viewHash(from));openDetail(id,false);history.replaceState({v:'detail',id,from,hasParent:!!prior?.hasParent},'',`#detail-${id}`);return}
 }
 const m=h.match(/^#day-([123])(?:-(map|timeline))?$/);
 if(m){const state={v:'day',d:+m[1],mode:m[2]||'timeline',hasParent:!!prior?.hasParent};renderViewState(state);history.replaceState(state,'',h);return}
 if(h==='#guide'){showGuide(false);history.replaceState({v:'guide',hasParent:!!prior?.hasParent},'',h);return}
 showTrip(false);history.replaceState({v:'trip'},'','#trip');
}
function findDayForId(id){for(const [d,x] of Object.entries(DAYS))if(x.items.some(i=>i.id===id))return +d;return 1}
window.addEventListener('popstate',e=>{const s=e.state;if(!s){if(detailOpen)hideDetail();restoreFromHash();restoreDetailFocus();return}if(s.v==='detail'){renderViewState(s.from||{v:'day',d:findDayForId(s.id),mode:'timeline'});openDetail(s.id,false);return}if(detailOpen)hideDetail();renderViewState(s);restoreDetailFocus()});
init();
</script>
</body>
</html>
